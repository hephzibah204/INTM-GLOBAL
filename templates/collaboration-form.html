{% extends "base.html" %}

{% block title %}Become a Collaborator | INTM Global{% endblock %}

{% block content %}
<div class="page-hero">
  <h1>Become a <em>Collaborator</em></h1>
  <p>Partner with INTM Global to drive innovation in nutritional science, education, and community health across Africa.</p>
</div>

<section id="collab-form-section">
  <div class="form-card" style="max-width: 700px;">
    <form id="collabForm">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group">
          <label for="organisation">Organisation Name</label>
          <input type="text" id="organisation" name="organisation" required>
        </div>
        <div class="form-group">
          <label for="contact_name">Contact Person</label>
          <input type="text" id="contact_name" name="contact_name" required>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone">
        </div>
      </div>
      <div class="form-group">
        <label for="collab_type">Collaboration Type</label>
        <select id="collab_type" name="collab_type" required>
          <option value="">-- Select Type --</option>
          <option value="Academic">Academic / Research</option>
          <option value="Corporate">Corporate / Industry</option>
          <option value="Government">Government / Policy</option>
          <option value="Healthcare">Healthcare Provider</option>
          <option value="NGO">Non-Profit / NGO</option>
        </select>
      </div>
      <div class="form-group">
        <label for="message">Partnership Proposal / Message</label>
        <textarea id="message" name="message" style="width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--cream); min-height: 150px; font-family: inherit;" required></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Submit Proposal</button>
    </form>
    <div id="form-message" style="margin-top: 16px; display: none; padding: 15px; border-radius: 6px; text-align: center;"></div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('collabForm');
  const msg  = document.getElementById('form-message');

  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.textContent = 'Submitting...';
    btn.disabled = true;

    try {
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      const res = await fetch('/api/submit/collaboration', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const resData = await res.json();
      msg.style.display = 'block';
      if (res.ok) {
        msg.textContent = 'Thank you! Your partnership proposal has been received. Our team will review it and contact you shortly.';
        msg.style.background = 'rgba(90,122,94,0.1)';
        msg.style.color = 'var(--sage-dark)';
        form.reset();
      } else {
        msg.textContent = resData.error || 'Submission failed. Please try again.';
        msg.style.background = 'rgba(181,135,74,0.1)';
        msg.style.color = 'var(--earth)';
      }
    } catch (err) {
      msg.style.display = 'block';
      msg.textContent = 'Connection error. Please try again.';
      msg.style.background = 'rgba(181,135,74,0.1)';
    } finally {
      btn.textContent = 'Submit Proposal';
      btn.disabled = false;
    }
  };
});
</script>
{% endblock %}
