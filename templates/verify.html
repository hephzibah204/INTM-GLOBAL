{% extends "base.html" %}

{% block title %}Verify Credentials | INTM Global{% endblock %}

{% block content %}
<div class="page-hero">
  <h1>Verify <em>Credentials</em></h1>
  <p>Validate the authenticity of INTM Global certificates and professional membership status through our secure verification portal.</p>
</div>

<section id="verification-portal">
  <div class="form-card" style="max-width: 600px;">
    <div style="display: flex; gap: 10px; margin-bottom: 24px;">
      <button id="tab-cert" class="btn-primary" style="flex: 1; border: none; cursor: pointer;" onclick="setVerifyTab('Certificate')">Certificate</button>
      <button id="tab-member" class="btn-secondary" style="flex: 1; cursor: pointer;" onclick="setVerifyTab('Membership')">Membership</button>
    </div>

    <form id="verifyForm">
      <input type="hidden" id="v-type" value="Certificate">
      <div class="form-group">
        <label id="id-label">Certificate ID</label>
        <input type="text" id="v-id" placeholder="e.g. INTM-CERT-2025-001" required>
      </div>
      <div class="form-group">
        <label>Full Name (as on document)</label>
        <input type="text" id="v-name" placeholder="e.g. Abiodun Emmanuel" required>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 10px;">Verify Now</button>
    </form>

    <div id="verify-result" style="margin-top: 24px; display: none; padding: 20px; border-radius: 8px; text-align: center;"></div>
  </div>
</section>

<script>
let currentVerifyTab = 'Certificate';

function setVerifyTab(t) {
  currentVerifyTab = t;
  document.getElementById('v-type').value = t;
  document.getElementById('id-label').textContent = t === 'Certificate' ? 'Certificate ID' : 'Membership ID';
  document.getElementById('v-id').placeholder = t === 'Certificate' ? 'e.g. INTM-CERT-2025-001' : 'e.g. INTM-MEM-2025-001';
  
  document.getElementById('tab-cert').className = t === 'Certificate' ? 'btn-primary' : 'btn-secondary';
  document.getElementById('tab-member').className = t === 'Membership' ? 'btn-primary' : 'btn-secondary';
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('verifyForm');
  const result = document.getElementById('verify-result');

  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.textContent = 'Verifying...';
    btn.disabled = true;
    result.style.display = 'none';

    try {
      const type = document.getElementById('v-type').value;
      const id   = document.getElementById('v-id').value.trim();
      const name = document.getElementById('v-name').value.trim();

      const res = await fetch(`/api/verify?id=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}&type=${encodeURIComponent(type)}`);
      const data = await res.json();

      result.style.display = 'block';
      if (res.ok && data.valid) {
        result.style.background = 'rgba(90,122,94,0.1)';
        result.style.color = 'var(--sage-dark)';
        result.innerHTML = `
          <div style="font-size: 40px; margin-bottom: 10px;">✅</div>
          <h3 style="margin-bottom: 5px;">Credential Verified</h3>
          <p style="font-size: 14px;">The ${type} for <strong>${data.name}</strong> is authentic and currently <strong>${data.status}</strong>.</p>
        `;
      } else {
        result.style.background = 'rgba(181,135,74,0.1)';
        result.style.color = 'var(--earth)';
        result.innerHTML = `
          <div style="font-size: 40px; margin-bottom: 10px;">❌</div>
          <h3 style="margin-bottom: 5px;">Verification Failed</h3>
          <p style="font-size: 14px;">${data.message || 'No matching record found. Please check the ID and name and try again.'}</p>
          <p style="font-size: 12px; margin-top: 10px;">If you believe this is an error, please <a href="./contact.html" style="color: inherit; font-weight: 600;">contact support</a>.</p>
        `;
      }
    } catch (err) {
      result.style.display = 'block';
      result.style.background = 'rgba(181,135,74,0.1)';
      result.textContent = 'Connection error. Please try again later.';
    } finally {
      btn.textContent = 'Verify Now';
      btn.disabled = false;
    }
  };
});
</script>
{% endblock %}
