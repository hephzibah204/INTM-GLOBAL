{% extends "base.html" %}

{% block title %}Workshop Registration | INTM Global{% endblock %}

{% block content %}
<div class="page-hero">
  <h1>Workshop <em>Registration</em></h1>
  <p>Secure your spot in our upcoming professional development sessions. Please fill out the form below to register.</p>
</div>

<section id="workshop-form-section">
  <div class="form-card">
    <form id="workshopForm">
      <div class="form-group">
        <label for="workshop">Selected Event</label>
        <select id="workshop" name="workshop" required>
          <option value="">-- Select a Workshop --</option>
          <option value="Gut Microbiome & Nutritional Therapy">Gut Microbiome & Nutritional Therapy</option>
          <option value="Nutritional Management of Diabetes">Nutritional Management of Diabetes</option>
          <option value="Paediatric Malnutrition">Paediatric Malnutrition</option>
        </select>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Dr. Jane Smith" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" required>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="+234..." required>
        </div>
        <div class="form-group">
          <label for="designation">Professional Designation</label>
          <input type="text" id="designation" name="designation" placeholder="e.g. Dietitian, Nurse, Student">
        </div>
      </div>
      <div class="form-group">
        <label for="message">Additional Notes (Optional)</label>
        <textarea id="message" name="message" style="width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 6px; background: var(--cream); min-height: 100px; font-family: inherit;"></textarea>
      </div>
      <button type="submit" class="btn-primary" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">Complete Registration</button>
    </form>
    <div id="form-message" style="margin-top: 20px; display: none; padding: 15px; border-radius: 6px; text-align: center;"></div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Pre-select workshop from URL if present
  const params = new URLSearchParams(window.location.search);
  const selected = params.get('event');
  if (selected) {
    const select = document.getElementById('workshop');
    for (let opt of select.options) {
      if (opt.value.includes(selected) || selected.includes(opt.value)) {
        opt.selected = true;
        break;
      }
    }
  }

  const form = document.getElementById('workshopForm');
  const msg  = document.getElementById('form-message');

  form.onsubmit = async (e) => {
    e.preventDefault();
    const btn = form.querySelector('button');
    btn.textContent = 'Registering...';
    btn.disabled = true;

    try {
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());

      const res = await fetch('/api/submit/workshop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const resData = await res.json();
      msg.style.display = 'block';
      if (res.ok) {
        msg.textContent = 'Registration successful! We will contact you shortly with further details.';
        msg.style.background = 'rgba(90,122,94,0.1)';
        msg.style.color = 'var(--sage-dark)';
        form.reset();
      } else {
        msg.textContent = resData.error || 'Registration failed. Please try again.';
        msg.style.background = 'rgba(181,135,74,0.1)';
        msg.style.color = 'var(--earth)';
      }
    } catch (err) {
      msg.style.display = 'block';
      msg.textContent = 'Connection error. Please check your internet and try again.';
      msg.style.background = 'rgba(181,135,74,0.1)';
    } finally {
      btn.textContent = 'Complete Registration';
      btn.disabled = false;
    }
  };
});
</script>
{% endblock %}
